name: Minu
description: 'Minu is Mexico''s leading employee benefits and financial wellness platform,
  serving more than 2,000 companies and over 1 million workers. Its flagship product is
  Salary On-Demand (earned wage access), which lets employees withdraw wages they have
  already earned before payday, alongside a high-yield savings account, low-interest
  payroll loans, food and gas vouchers (vales de despensa y gasolina), a rewards card,
  a corporate expense card, telemedicine, insurance and assistance coverage, a discount
  club, and a financial-education program. Employers adopt Minu to reduce talent turnover
  and improve workforce financial wellness. Minu is a QED Investors portfolio company.
  As of this enrichment pass, Minu publishes no public API, developer portal, or SDK
  surface.'
